# DeepSeek v4.1 flash via the DeepSeek API directly, thinking OFF (weaker mode: a stand-in for a small student when
# comparing code formats; and a teacher whose visible reply is everything it relied on).
# Submission uses config.yaml. Needs DEEKSEEK_API_KEY (.env) and DEEPSEEK_BASE_URL=https://api.deepseek.com.
llm:
  model: deepseek-flash
  base_url_env: DEEPSEEK_BASE_URL
  api_key_env: DEEKSEEK_API_KEY
  max_tokens: 8192                 # = the student config.yaml: a longer teacher reply could never be imitated
  seed: 0
  temperature: 0
  timeout_seconds: 400
  retries: 2
  max_concurrency: 8
  max_comment_lines: 40                # comments are harmless; only a flood of them is stopped
  extra_body:
    thinking:
      type: disabled
agent:
  max_calls: 3                     # program, then up to two repairs or a confirmation (user, 11/11)
  question_seconds: 900
sandbox:
  memory_gib: 4
  cpu_seconds: 60
  wall_seconds: 30
run:
  workers: 8
  total_seconds: 20700
  cache_dir: outputs/cache
  dev_limit: 6
