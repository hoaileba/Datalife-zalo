#   decimal_units: base units sold by weight (quantities with decimals)   visits: tables | plates
#   lots: true (lots with expiry dates)   staff: number of staff   takeaway: share of orders without table/guests
# Item keys: sizes [..] + size_fmt ('{n} size {s}' | '{n} ({s})') + size_step (price step per size) expand one
