[project]
name = "datamate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"           # the measured env: 3.12.16
# pandas 2.2 + numpy 1.26: the idioms the model writes (scripts/compat.py, DECISIONS 09/11)
